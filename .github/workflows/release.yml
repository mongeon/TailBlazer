name: Release

# Pushing a tag such as v0.9.6 builds, tests and publishes a GitHub release with two zips:
# a standalone executable and a smaller framework-dependent one.
# Running it manually only produces the zips as a workflow artifact.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: Source/TailBlazer.sln
  PROJECT: Source/TailBlazer/TailBlazer.csproj
  RUNTIME: win-x64

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release

      # Standalone: embeds the .NET runtime, nothing needs to be installed
      - name: Publish standalone executable
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release
          --runtime ${{ env.RUNTIME }}
          --self-contained true
          --output publish/standalone
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none

      # Framework-dependent: much smaller, requires the .NET 10 Desktop Runtime to be installed
      - name: Publish framework-dependent executable
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release
          --runtime ${{ env.RUNTIME }}
          --self-contained false
          --output publish/framework-dependent
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none

      - name: Create zips
        id: zip
        shell: pwsh
        run: |
          $prefix = "TailBlazer-${{ steps.version.outputs.version }}-${{ env.RUNTIME }}"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path publish/standalone/* -DestinationPath "dist/$prefix.zip"
          Compress-Archive -Path publish/framework-dependent/* -DestinationPath "dist/$prefix-framework-dependent.zip"
          "name=$prefix" >> $env:GITHUB_OUTPUT

      - name: Upload zips
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/*.zip

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # pwsh does not expand wildcards for native commands, so pass the files explicitly
          $zips = (Get-ChildItem dist/*.zip).FullName
          gh release create "${{ github.ref_name }}" @zips --title "TailBlazer ${{ steps.version.outputs.version }}" --generate-notes
