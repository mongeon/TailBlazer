name: Release

# Pushing a tag such as v0.9.6 builds, tests and publishes a GitHub release with a standalone zip.
# Running it manually only produces the zip as a workflow artifact.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: Source/TailBlazer.sln
  PROJECT: Source/TailBlazer/TailBlazer.csproj
  RUNTIME: win-x64

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 6.0.x provides the runtime used by the tests until the app moves to a newer target framework
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release

      - name: Publish standalone executable
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release
          --runtime ${{ env.RUNTIME }}
          --self-contained true
          --output publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none

      - name: Create zip
        id: zip
        shell: pwsh
        run: |
          $zip = "TailBlazer-${{ steps.version.outputs.version }}-${{ env.RUNTIME }}.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          "file=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.file }}
          path: ${{ steps.zip.outputs.file }}

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.zip.outputs.file }}" --title "TailBlazer ${{ steps.version.outputs.version }}" --generate-notes
